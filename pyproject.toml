[project]
name = "tratt"
version = "0.1.0"
description = "Transient formation dynamics of acoustic Bragg satellites in dynamical X-ray diffraction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
keywords = ["x-ray diffraction", "takagi-taupin", "dynamical diffraction", "acoustic waves", "ultrafast", "crystallography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/NaNIsaac/TraTT"
Repository = "https://github.com/NaNIsaac/TraTT"
Issues = "https://github.com/NaNIsaac/TraTT/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tratt"]

[tool.hatch.build.targets.sdist]
include = ["src/tratt", "tests", "README.md", "LICENSE", "DESIGN.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupytext>=1.19.5",
    "nbstripout>=0.9.1",
]
